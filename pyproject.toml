[project]
name = "mlzoomcamp-midterm-project"
version = "0.1.0"
description = "Employee Attrition Prediction - ML Zoomcamp Midterm Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.0",
    "uvicorn>=0.30.0",
    "xgboost>=2.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
]
